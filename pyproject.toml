[project]
name = "cancer-prediction-xg253"
version = "0.1.0"
description = "A basic model to predict cancerous tumors based on certain properties."
authors = [{name = "Harry Potter"}]
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.5.2",
    "numpy>=2.1.3",
    "ipykernel>=6.30.1",
    "pandas>=2.3.2",
    "matplotlib>=3.10.6",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "black>=24.8.0",
    "flake8>=5.0.4",
    "isort>=5.13.2",
]

[project.scripts]
cancer-prediction = "cancer_prediction_xg253.scripts.app:cli"
train = "cancer_prediction_xg253.scripts.app:train"



[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
package = true